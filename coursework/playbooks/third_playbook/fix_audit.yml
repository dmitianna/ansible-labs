
---
- name: Настройка подсистемы аудита Linux
  hosts: department
  become: true
  gather_facts: false

  tasks:
    - name: Установка подсистемы аудита
      ansible.builtin.apt:
        name: auditd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Запуск и включение службы аудита
      ansible.builtin.systemd_service:
        name: auditd.service
        state: started
        enabled: true

    - name: Настройка правил аудита учётных записей
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/90-coursework.rules
        owner: root
        group: root
        mode: '0640'
        content: |
          -a always,exit -F path=/etc/passwd -F perm=wa -k coursework_identity
          -a always,exit -F path=/etc/shadow -F perm=wa -k coursework_identity
      notify: Загрузка правил аудита

  handlers:
    - name: Загрузка правил аудита
      ansible.builtin.command:
        argv:
          - /sbin/augenrules
          - --load
