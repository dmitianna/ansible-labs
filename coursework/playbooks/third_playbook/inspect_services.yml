
---
- name: Исследование состояния системных служб
  hosts: department
  become: true
  gather_facts: false

  vars:
    candidate_services:
      - ssh.service
      - avahi-daemon.service
      - cups.service
      - rpcbind.service
      - smbd.service
      - nfs-server.service
      - vsftpd.service
      - snmpd.service
      - autofs.service

  tasks:
    - name: Сбор сведений о системных службах
      ansible.builtin.service_facts:

    - name: Вывод состояния выбранных служб
      ansible.builtin.debug:
        msg:
          - "Узел: {{ inventory_hostname }}"
          - "Служба: {{ item }}"
          - "Текущее состояние: {{ ansible_facts['services'].get(item, {}).get('state', 'не обнаружена') }}"
          - "Статус автозапуска: {{ ansible_facts['services'].get(item, {}).get('status', 'не определён') }}"
      loop: "{{ candidate_services }}"
      loop_control:
        label: "{{ item }}"
