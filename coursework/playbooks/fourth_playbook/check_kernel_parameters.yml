
---
- name: Исследование параметров защиты ядра Linux
  hosts: department
  become: true
  gather_facts: false

  vars:
    kernel_parameters:
      - name: kernel.dmesg_restrict
        expected: '1'
      - name: kernel.kptr_restrict
        expected: '2'
      - name: vm.unprivileged_userfaultfd
        expected: '0'
      - name: kernel.randomize_va_space
        expected: '2'
      - name: fs.protected_symlinks
        expected: '1'
      - name: fs.protected_hardlinks
        expected: '1'
      - name: fs.suid_dumpable
        expected: '0'

  tasks:
    - name: Получение действующих значений параметров ядра
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item.name }}"
      loop: "{{ kernel_parameters }}"
      loop_control:
        label: "{{ item.name }}"
      register: kernel_values
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Инициализация общего результата проверки ядра
      ansible.builtin.set_fact:
        kernel_compliant: true
        kernel_check_error: false

    - name: Объединение результатов проверки параметров ядра
      ansible.builtin.set_fact:
        kernel_check_error: >-
          {{ (kernel_check_error | bool) or ((item.rc | default(1)) != 0) }}
        kernel_compliant: >-
          {{
            (kernel_compliant | bool)
            and ((item.rc | default(1)) == 0)
            and ((item.stdout | default('') | trim) == item.item.expected)
          }}
      loop: "{{ kernel_values.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Вывод результатов исследования
      ansible.builtin.debug:
        msg:
          - "Узел: {{ inventory_hostname }}"
          - "Параметр: {{ item.item.name }}"
          - "Доступен: {{ item.rc == 0 }}"
          - "Фактическое значение: {{ item.stdout | trim if item.rc == 0 else 'не получено' }}"
          - "Требуемое значение: {{ item.item.expected }}"
          - "Соответствует: {{ (item.stdout | trim) == item.item.expected if item.rc == 0 else 'проверка не выполнена' }}"
          - "Ошибка: {{ item.stderr | trim if item.rc != 0 else 'нет' }}"
      loop: "{{ kernel_values.results }}"
      loop_control:
        label: "{{ item.item.name }}"
